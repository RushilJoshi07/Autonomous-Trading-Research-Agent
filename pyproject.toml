[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-finance-platform"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "yfinance>=0.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tenacity>=8.0",
    "backtesting>=0.3",
    "pandas-ta>=0.4.67b0",
    "anthropic[bedrock]>=0.40",
    "alembic>=1.13",
    "mcp>=1.0",
    "scipy>=1.11",
    "langgraph>=0.2",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "langchain-text-splitters>=0.3",
    "arxiv>=2.1",
    "pgvector>=0.3",
    "tavily-python>=0.5",
    "langsmith>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
